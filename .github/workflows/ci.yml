name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (tags are mutable,
      # a re-tag is a supply-chain vector); the trailing comment tracks the
      # human version. .github/dependabot.yml bumps these via reviewed PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track the latest patched toolchain, NOT the go.mod floor. With
          # go-version-file, setup-go installs the exact `go 1.25.0` directive —
          # the unpatched .0 release — and govulncheck then (correctly) flags
          # every stdlib CVE fixed in later 1.25.x patches, reddening CI on
          # green code. 'stable' keeps the compiler fully patched so govulncheck
          # stays a meaningful signal.
          go-version: stable
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
